<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>MovieTrak</title>
<meta name="description" content="A local-first watchlist for films, television, games and anime.">

<!-- Relative paths, because this has to resolve identically from file:// and
     from a project page served under /entertainmentwatch/. A leading slash
     would break the second one.
     The SVG wins wherever it is supported and stays crisp on a retina tab;
     the .ico is the fallback and also stops browsers hitting /favicon.ico and
     logging a 404 on every load. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="32x32">
<link rel="apple-touch-icon" href="icon-180.png">

<!-- Tints the browser chrome to match whichever ground the app is painting. -->
<meta name="theme-color" content="#F8F9F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071619" media="(prefers-color-scheme: dark)">

<!-- Theme is resolved BEFORE the stylesheets paint. Doing this in a deferred
     script would flash the wrong ground colour on every load. -->
<script>
(function () {
  var t;
  try { t = localStorage.getItem('mt.theme'); } catch (e) {}
  if (t !== 'light' && t !== 'dark') {
    t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  }
  document.documentElement.setAttribute('data-theme', t);
})();
</script>

<link rel="stylesheet" href="css/01-tokens.css">
<link rel="stylesheet" href="css/02-base.css">
<link rel="stylesheet" href="css/03-components.css">
<link rel="stylesheet" href="css/04-views.css">
<!-- Must load last: it carries every media query, and they override component
     rules of equal specificity defined in the files above. -->
<link rel="stylesheet" href="css/05-responsive.css">

<!-- The gate sits in front of the app. The repository is the source of
     truth, so nothing renders until the library has been signed into. -->
<div class="gate" id="gate" hidden></div>

<div class="app">

  <!-- ── Pane 1 · the index tree ────────────────────────────────────────── -->
  <aside class="pane tree-pane" id="treePane">
    <div class="pane-h">
      <a class="brand" href="#/library"><b>MovieTrak</b><i>Tide</i></a>
      <div class="tswitch" role="group" aria-label="Colour theme" id="tswitch">
        <button type="button" data-theme-set="light" aria-pressed="false" title="Low tide">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/>
          </svg>Low
        </button>
        <button type="button" data-theme-set="dark" aria-pressed="false" title="Deep water">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/>
          </svg>Deep
        </button>
      </div>
    </div>

    <div class="filter">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
      </svg>
      <input id="treeFilter" type="search" placeholder="Filter index…" spellcheck="false" aria-label="Filter the index">
    </div>

    <div class="scroll">
      <nav class="tree" id="tree" role="tree" aria-label="Library index"></nav>
    </div>

    <div class="tree-foot">
      <span><kbd>↑</kbd><kbd>↓</kbd> move</span>
      <span><kbd>←</kbd><kbd>→</kbd> fold</span>
      <span><kbd>/</kbd> search</span>
      <span><kbd>⏎</kbd> open</span>
    </div>
  </aside>

  <!-- ── Pane 2 · the working surface ───────────────────────────────────── -->
  <main class="pane list-pane">
    <div class="mobilebar">
      <button class="icobtn" id="menuBtn" aria-label="Open index">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16"/>
        </svg>
      </button>
      <div class="brand"><b>MovieTrak</b></div>
      <a class="icobtn" href="#/search" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
        </svg>
      </a>
    </div>

    <div class="pane-h">
      <div class="crumb" id="crumb"></div>
      <div id="paneActions" style="display:flex;gap:var(--mt-space-2);align-items:center"></div>
    </div>

    <div id="banner" class="banner" hidden></div>

    <div class="scroll" id="viewScroll">
      <div id="view" tabindex="-1"></div>

      <footer class="colophon">
        <p>
          <span class="tmdb-logo" aria-hidden="true"></span>
          This website uses TMDB and the TMDB APIs but is not endorsed, certified, or otherwise approved by TMDB.
        </p>
        <p>
          Game data by <a href="https://rawg.io/" target="_blank" rel="noopener">RAWG</a>
          · Ratings via <a href="https://www.omdbapi.com/" target="_blank" rel="noopener">OMDb</a>
          · Anime data by <a href="https://anilist.co/" target="_blank" rel="noopener">AniList</a>
          · A personal, non-commercial tool.
        </p>
        <p id="footMeta" class="mono"></p>
      </footer>
    </div>
  </main>

  <!-- ── Pane 3 · the inspector ─────────────────────────────────────────── -->
  <aside class="pane insp" id="inspector" aria-label="Selected title"></aside>
</div>

<div class="scrim" id="scrim"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>
